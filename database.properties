# Pengaturan database aplikasi.
#
# type=mysql  -> memakai MySQL/MariaDB (cocok untuk dipakai bersama di jaringan sekolah, mis. XAMPP)
# type=h2     -> memakai database lokal di folder data/ (hanya untuk satu komputer)
#
# Tabel dibuat otomatis saat aplikasi pertama dijalankan. Database "sekolah" juga dibuat otomatis
# bila user di bawah punya hak CREATE (user root XAMPP punya).
#
# Di komputer lain (mis. komputer siswa), ganti host dengan alamat IP komputer server,
# misalnya host=192.168.1.10, dan pakai user khusus (lihat setup_mysql.sql), bukan root.

type=mysql
host=localhost
port=3306
name=sekolah
user=root
password=
